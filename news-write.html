<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지 글쓰기 | 화성시 서부리틀야구단</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_ds/industry-54b9aa32-a678-416e-88f1-516c816cb45b/styles.css">
<style>
  body { margin:0; font-family:"Noto Sans KR", var(--font-body); }
  h1,h2,h3,h4 { font-family:"Barlow Condensed","Noto Sans KR",sans-serif; }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: #d1491f; }

  .wf-card {
    background: #fff; border-radius: 20px; padding: 32px;
    box-shadow: 0 24px 60px rgba(22,35,63,.14), 0 2px 8px rgba(22,35,63,.06);
    border: 1px solid var(--color-divider);
  }
  .wf-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  .wf-label { font-size: 12px; font-weight: 700; color: #16233f; letter-spacing: .02em; }
  .wf-input, .wf-select {
    width: 100%; box-sizing: border-box; padding: 13px 15px; font: inherit; font-size: 15px;
    border: 1.5px solid #e4e7ee; border-radius: 10px; background: #f7f8fa; color: #16233f;
  }
  .wf-input:focus, .wf-select:focus { outline: none; border-color: #d1491f; background: #fff; }
  textarea.wf-input { resize: vertical; min-height: 120px; }
  .wf-submit {
    width: 100%; height: 50px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #e2531f, #c53c14); color: #fff;
    font-size: 16px; font-weight: 800;
  }
  .wf-submit:disabled { opacity: .6; cursor: default; }
  .wf-alert {
    display: none; margin-top: 14px; padding: 13px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
  }
  .wf-alert-success { background: #eaf6ee; color: #1f7a3f; }
  .wf-alert-error { background: #fdecea; color: #b3261e; }
</style>
</head>
<body>

<div style="background:#fff; color:var(--color-text); min-height:100vh">

  <header style="background:#fff; color:#16233f; border-bottom:3px solid #d1491f">
    <div style="max-width:1240px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap">
      <a href="index.html#top" style="display:flex; align-items:center; gap:10px; color:#16233f">
        <img src="assets/logo-v2.png" alt="화성시 서부리틀야구단" style="width:40px; height:40px; object-fit:contain">
        <span style="font-family:'Barlow Condensed',sans-serif; font-size:17px; letter-spacing:.04em">HWASEONG LITTLE CLUB</span>
      </a>
      <a href="news.html" style="font-size:14px; font-weight:700; color:#16233f">← 공지·소식으로</a>
    </div>
  </header>

  <section style="max-width:480px; margin:0 auto; padding:56px 24px 80px">
    <span style="font-size:12px; letter-spacing:.16em; color:var(--color-neutral-600)">ADMIN</span>
    <h1 style="font-size:32px; margin:6px 0 28px">공지 글쓰기</h1>

    <form id="login-form" class="wf-card">
      <div class="wf-field"><label class="wf-label">아이디</label><input class="wf-input" name="id" autocomplete="username" required></div>
      <div class="wf-field"><label class="wf-label">비밀번호</label><input class="wf-input" type="password" name="password" autocomplete="current-password" required></div>
      <button type="submit" class="wf-submit">로그인</button>
      <div id="login-error" class="wf-alert wf-alert-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    </form>

    <form id="post-form" class="wf-card" style="display:none">
      <div class="wf-field">
        <label class="wf-label">구분</label>
        <select class="wf-select" name="category">
          <option value="공지">공지</option>
          <option value="경기">경기</option>
          <option value="안내">안내</option>
        </select>
      </div>
      <div class="wf-field"><label class="wf-label">제목</label><input class="wf-input" name="title" required></div>
      <div class="wf-field"><label class="wf-label">내용</label><textarea class="wf-input" name="body" required></textarea></div>
      <div class="wf-field"><label class="wf-label">사진 (선택)</label><input class="wf-input" type="file" name="photo" accept="image/*"></div>
      <button type="submit" class="wf-submit"><span id="post-submit-label">등록하기</span></button>
      <div id="post-success" class="wf-alert wf-alert-success">✓ 등록됐습니다. 1~2분 뒤 사이트에 반영돼요.</div>
      <div id="post-error" class="wf-alert wf-alert-error"></div>
    </form>
  </section>

  <footer style="background:#0f1932; color:#9fb3cf">
    <div style="max-width:1240px; margin:0 auto; padding:40px 24px; display:flex; gap:24px; flex-wrap:wrap; align-items:center">
      <img src="assets/logo-v2.png" alt="" style="width:56px; height:56px; object-fit:contain">
      <div style="font-size:13px; line-height:1.8">
        <div style="color:#f2f2f3; font-family:'Barlow Condensed',sans-serif; font-size:18px; letter-spacing:.08em">HWASEONG LITTLE CLUB · 화성시 서부리틀야구단</div>
        <div id="footer-contact">경기도 화성시 · 031-000-0000 · hwaseongwest@example.com</div>
        <div>© 2026 Hwaseong Seobu Little Baseball Club. All rights reserved.</div>
      </div>
    </div>
  </footer>

</div>

<script>
(function () {
  var AUTH_URL = 'https://cms-oauth-proxy-puce.vercel.app/auth';
  var REPO = 'minjh8768-al/hwaseong-little-club';
  var FILE_PATH = 'content/site.json';
  var API_BASE = 'https://api.github.com/repos/' + REPO + '/contents/' + FILE_PATH;
  var TOKEN_KEY = 'hwaseong_admin_token';

  var loginForm = document.getElementById('login-form');
  var postForm = document.getElementById('post-form');
  var loginError = document.getElementById('login-error');
  var postSuccess = document.getElementById('post-success');
  var postError = document.getElementById('post-error');
  var postSubmitLabel = document.getElementById('post-submit-label');

  function b64EncodeUnicode(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function b64DecodeUnicode(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  function showPostForm() {
    loginForm.style.display = 'none';
    postForm.style.display = 'block';
  }

  var savedToken = sessionStorage.getItem(TOKEN_KEY);
  if (savedToken) showPostForm();

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginError.style.display = 'none';
    var id = loginForm.querySelector('[name="id"]').value.trim();
    var password = loginForm.querySelector('[name="password"]').value;

    fetch(AUTH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, password: password })
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, data: data }; });
    }).then(function (r) {
      if (!r.ok) {
        loginError.textContent = r.data.error || '로그인 실패';
        loginError.style.display = 'block';
        return;
      }
      sessionStorage.setItem(TOKEN_KEY, r.data.token);
      showPostForm();
    }).catch(function (err) {
      loginError.textContent = '오류가 발생했습니다: ' + err.message;
      loginError.style.display = 'block';
    });
  });

  postForm.addEventListener('submit', function (e) {
    e.preventDefault();
    postSuccess.style.display = 'none';
    postError.style.display = 'none';
    var submitBtn = postForm.querySelector('.wf-submit');
    submitBtn.disabled = true;
    postSubmitLabel.textContent = '등록 중...';

    var token = sessionStorage.getItem(TOKEN_KEY);
    var category = postForm.querySelector('[name="category"]').value;
    var title = postForm.querySelector('[name="title"]').value.trim();
    var body = postForm.querySelector('[name="body"]').value.trim();
    var photoFile = postForm.querySelector('[name="photo"]').files[0];
    var today = new Date();
    var dateStr = today.getFullYear() + '.' + String(today.getMonth() + 1).padStart(2, '0') + '.' + String(today.getDate()).padStart(2, '0');
    var dateLabel = category + ' · ' + dateStr;

    function readFileAsBase64(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          // reader.result is "data:<mime>;base64,<data>" — keep just the data.
          resolve(reader.result.split(',')[1]);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function uploadPhoto() {
      if (!photoFile) return Promise.resolve('');
      var safeName = photoFile.name.replace(/[^a-zA-Z0-9.\-_가-힣]/g, '_');
      var uploadPath = 'assets/uploads/' + Date.now() + '-' + safeName;
      return readFileAsBase64(photoFile).then(function (base64) {
        return fetch('https://api.github.com/repos/' + REPO + '/contents/' + uploadPath, {
          method: 'PUT',
          headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: '공지 사진 업로드: ' + title, content: base64 })
        }).then(function (res) {
          if (!res.ok) return res.json().then(function (err) { throw new Error(err.message || '사진 업로드에 실패했어요'); });
          return '/hwaseong-little-club/' + uploadPath;
        });
      });
    }

    uploadPhoto()
      .then(function (imagePath) {
        return fetch(API_BASE, { headers: { Authorization: 'token ' + token } }).then(function (res) {
          if (!res.ok) throw new Error('기존 내용을 불러오지 못했어요 (로그인이 만료됐을 수 있어요)');
          return res.json();
        }).then(function (fileData) {
          var content = JSON.parse(b64DecodeUnicode(fileData.content));
          content.news = content.news || [];
          content.news.unshift({ date_label: dateLabel, title: title, body: body, image: imagePath });

          return fetch(API_BASE, {
            method: 'PUT',
            headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: '공지 추가: ' + title,
              content: b64EncodeUnicode(JSON.stringify(content, null, 2) + '\n'),
              sha: fileData.sha
            })
          });
        });
      })
      .then(function (putRes) {
        if (!putRes.ok) {
          return putRes.json().then(function (err) {
            throw new Error(err.message || '저장에 실패했어요');
          });
        }
        postSuccess.style.display = 'block';
        postForm.reset();
      })
      .catch(function (err) {
        postError.textContent = err.message;
        postError.style.display = 'block';
      })
      .finally(function () {
        submitBtn.disabled = false;
        postSubmitLabel.textContent = '등록하기';
      });
  });
})();
</script>
<script src="assets/site.js" defer></script>
</body>
</html>
