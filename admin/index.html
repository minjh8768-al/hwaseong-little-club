<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화성서부리틀야구단 관리자</title>
  <style>
    /* Hide Decap's own footer branding link on the login screen. */
    a[href*="decap" i] { display: none !important; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    (function () {
      function hideDecapBranding() {
        document.querySelectorAll('a').forEach(function (a) {
          if (/decap/i.test(a.textContent || '') || /decap/i.test(a.href || '')) {
            a.style.display = 'none';
          }
        });
      }
      function renameLoginButton() {
        document.querySelectorAll('button').forEach(function (btn) {
          var isLoginBtn = false;
          Array.from(btn.childNodes).forEach(function (node) {
            if (node.nodeType === 3 && /GitHub\s*로\s*로그인|^\s*로그인\s*$/.test(node.textContent)) {
              node.textContent = '로그인';
              isLoginBtn = true;
            }
          });
          if (isLoginBtn) {
            btn.querySelectorAll('svg').forEach(function (svg) { svg.style.display = 'none'; });
            btn.style.marginLeft = 'auto';
            btn.style.marginRight = 'auto';
            btn.style.justifyContent = 'center';
            if (btn.parentElement) btn.parentElement.style.textAlign = 'center';
          }
        });
      }
      function hideDecapFooterLogo() {
        document.querySelectorAll('*').forEach(function (el) {
          if (el.children.length === 0 && el.textContent.trim() === 'Decap') {
            var wrap = el.closest('a') || el.parentElement;
            if (wrap) wrap.style.display = 'none';
          }
        });
      }
      function coverDecapLogo() {
        if (document.getElementById('cover-decap')) return;
        var bg = getComputedStyle(document.body).backgroundColor;
        var div = document.createElement('div');
        div.id = 'cover-decap';
        div.style.cssText =
          'position:fixed; left:0; right:0; bottom:0; height:70px; ' +
          'background:' + bg + '; z-index:9999;';
        document.body.appendChild(div);
      }
      function tidyLoginScreen() {
        hideDecapBranding();
        hideDecapFooterLogo();
        renameLoginButton();
        coverDecapLogo();
      }
      new MutationObserver(tidyLoginScreen).observe(document.documentElement, { childList: true, subtree: true });
      tidyLoginScreen();
    })();
  </script>
</body>
</html>
