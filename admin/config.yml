backend:
  name: github
  repo: minjh8768-al/hwaseong-little-club
  branch: main
  # Auth goes through a GitHub OAuth App registered on the Netlify
  # site's Access control > OAuth panel (that panel works even though
  # this site's own deploys are paused — it's not a deploy). This lets
  # the admin be hosted anywhere (GitHub Pages included) and login with
  # a GitHub account instead of a Netlify Identity email/password.
  base_url: https://sage-liger-8a57dd.netlify.app

media_folder: "assets/uploads"
public_folder: "assets/uploads"

locale: "ko"

logo_url: "https://minjh8768-al.github.io/hwaseong-little-club/assets/logo-v2.png"
site_url: "https://minjh8768-al.github.io/hwaseong-little-club/"
display_url: "https://minjh8768-al.github.io/hwaseong-little-club/"

collections:
  - name: "site"
    label: "웹사이트 내용"
    files:
      - name: "content"
        label: "전체 콘텐츠"
        file: "content/site.json"
        fields:
          - label: "메인 배너"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "작은 태그 1 (예: SINCE 2020)", name: "kicker1", widget: "string" }
              - { label: "작은 태그 2 (예: HWASEONG CITY · SEOBU)", name: "kicker2", widget: "string" }
              - { label: "큰 제목 1번째 줄", name: "title_line1", widget: "string" }
              - { label: "큰 제목 2번째 줄", name: "title_line2", widget: "string" }
              - { label: "소개 문구", name: "subtitle", widget: "text" }
              - { label: "배경 사진", name: "image", widget: "image", required: false, hint: "아래 배경 영상을 넣으면 이 사진 대신 영상이 재생됩니다." }
              - { label: "배경 영상 (선택, 사진보다 우선 재생됨)", name: "video", widget: "file", required: false, hint: "mp4 파일 권장. 너무 큰 파일(50MB 이상)은 업로드/로딩이 느려질 수 있어요." }
              - label: "통계 (창단/등록선수 등)"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "숫자/값", name: "value", widget: "string" }
                  - { label: "설명", name: "label", widget: "string" }

          - label: "구단 소개"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "소개 문구", name: "text", widget: "text" }
              - { label: "사진 1 - 구단소개", name: "photo", widget: "image", required: false }
              - { label: "사진 2 - 선수반안내", name: "photo2", widget: "image", required: false }
              - { label: "사진 3 - 육성반안내", name: "photo3", widget: "image", required: false }

          - label: "선수단 · 코칭스태프"
            name: "roster"
            widget: "list"
            fields:
              - { label: "등번호 (코치는 HC/AC 등)", name: "number", widget: "string" }
              - { label: "이름", name: "name", widget: "string" }
              - { label: "포지션 · 학년", name: "position", widget: "string" }
              - { label: "프로필 사진", name: "photo", widget: "image", required: false }

          - label: "공지 · 소식"
            name: "news"
            widget: "list"
            fields:
              - { label: "날짜 표시 (예: 공지 · 2026.09.05)", name: "date_label", widget: "string" }
              - { label: "제목", name: "title", widget: "string" }
              - { label: "내용", name: "body", widget: "text" }
              - { label: "사진", name: "image", widget: "image", required: false }

          - label: "갤러리"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "사진", name: "photo", widget: "image", required: false }

          - label: "경기 일정"
            name: "schedule"
            widget: "list"
            fields:
              - { label: "일자 (예: 09.13 (일))", name: "date", widget: "string" }
              - { label: "대회", name: "competition", widget: "string" }
              - { label: "상대", name: "opponent", widget: "string" }
              - { label: "장소", name: "venue", widget: "string" }
              - label: "결과 종류"
                name: "result_type"
                widget: "select"
                options:
                  - { label: "예정", value: "upcoming" }
                  - { label: "승", value: "win" }
                  - { label: "패", value: "lose" }
              - { label: "결과 표시 텍스트 (예: 승 7 : 4, 예정)", name: "result_text", widget: "string" }

          - label: "SNS · 미디어"
            name: "sns"
            widget: "object"
            collapsed: true
            fields:
              - { label: "네이버 클립 링크", name: "naver_clip", widget: "string", required: false }
              - { label: "네이버 밴드 링크", name: "naver_band", widget: "string", required: false }
              - { label: "인스타그램 링크", name: "instagram", widget: "string", required: false }
              - { label: "블로그 링크", name: "blog", widget: "string", required: false }

          - label: "입단 안내 · 연락처"
            name: "join"
            widget: "object"
            collapsed: true
            fields:
              - { label: "훈련장 위치", name: "training_location", widget: "string" }
              - { label: "훈련 시간", name: "training_time", widget: "string" }
              - { label: "전화번호", name: "phone", widget: "string" }
              - { label: "이메일 (입단 신청서가 이 주소로 전송됩니다)", name: "email", widget: "string" }
